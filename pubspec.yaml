name: crushie
description: A modern social connection platform for Kenya and beyond
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Backend)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7

  # Google Sign-In
  google_sign_in: ^6.2.2
  flutter_plugin_android_lifecycle: ^2.0.25

  # State Management
  provider: ^6.1.2

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  timeago: ^3.7.0
  fluttertoast: ^8.2.8
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  geolocator: ^13.0.1
  uuid: ^4.5.1
  flutter_dotenv: ^5.1.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
