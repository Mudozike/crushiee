name: crushie
description: A modern social connection platform for Kenya and beyond
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.16.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Backend)
  firebase_core: 1.24.0
  firebase_auth: 3.11.2
  cloud_firestore: 3.5.1
  firebase_storage: 10.3.11

  # Google Sign-In
  google_sign_in: 5.4.0

  # State Management
  provider: 6.0.3

  # UI & Design
  google_fonts: 3.0.1
  flutter_svg: 1.0.3
  cached_network_image: 3.2.0
  shimmer: 2.0.0

  # Navigation
  go_router: 3.1.0

  # Utilities
  intl: 0.17.0
  timeago: 3.3.0
  fluttertoast: 8.1.2
  url_launcher: 6.1.7
  share_plus: 4.5.3
  image_picker: 0.8.6
  flutter_secure_storage: 6.0.0
  http: 0.13.5
  geolocator: 9.0.2
  uuid: 3.0.7

dependency_overrides:
  firebase_core_platform_interface: 4.5.1
  firebase_auth_platform_interface: 6.3.0
  firebase_auth_web: 3.3.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
